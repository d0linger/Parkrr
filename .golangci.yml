# golangci-lint configuration for Parkrr.
run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - gocritic
    - bodyclose
    - unconvert
    - unparam
    - nakedret

linters-settings:
  goimports:
    local-prefixes: github.com/preining/parkrr
  misspell:
    locale: US
    ignore-words:
      - cancelled
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - unparam
        - gocritic
  max-issues-per-linter: 0
  max-same-issues: 0
