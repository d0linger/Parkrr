version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - gocritic
    - misspell
    - nakedret
    - revive
    - unconvert
    - unparam
  settings:
    misspell:
      locale: US
      # Deutsche Woerter, die der US-Rechtschreibpruefer fuer verunglueckte englische
      # haelt. Die Oberflaeche UND die Kommentare dieses Projekts sind deutsch (siehe
      # CONTRIBUTING.md), also sind das keine Tippfehler, sondern die Sprache selbst.
      # "Konfiguration" ist nicht "Configuration", "irreversibel" nicht "irreversible".
      ignore-rules:
        - cancelled
        - konfiguration
        - konstellation
        - destruktive
        - irreversibel
        - willk
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gocritic
          - unparam
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/preining/parkrr
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
