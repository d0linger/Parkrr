# Optional monitoring stack (Prometheus + Grafana) for Parkrr.
#
# Run it as an overlay on top of the main compose file:
#
#   docker compose -f docker-compose.yml \
#                  -f deploy/monitoring/docker-compose.monitoring.yml up -d
#
# Grafana comes up on http://localhost:3000 (admin / admin on first login) with
# the Prometheus datasource and the "Parkrr — Service Overview" dashboard
# already provisioned. Both services join the existing `parkrr-net` network so
# Prometheus can scrape the app at app:8080/metrics.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: parkrr-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # If you use a metrics token, drop it in deploy/monitoring/metrics_token
      # and uncomment the authorization block in prometheus.yml:
      # - ./deploy/monitoring/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    ports:
      - "${PARKRR_PROMETHEUS_PORT:-9090}:9090"
    networks:
      - parkrr-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: parkrr-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Required — no weak default. Set GRAFANA_ADMIN_PASSWORD before bringing the
      # monitoring stack up (Compose fails fast if it is unset).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD for the monitoring stack}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${PARKRR_GRAFANA_PORT:-3000}:3000"
    networks:
      - parkrr-net

volumes:
  prometheus-data:
  grafana-data:

# `parkrr-net` is defined by the base docker-compose.yml; this file is meant to
# be merged on top of it (see the header), so the network is shared, not
# redeclared here.
