title = "Parkrr"

# Die Standardregeln von gitleaks bleiben VOLLSTÄNDIG aktiv — useDefault erweitert
# sie, es ersetzt sie nicht. Ergänzt wird ausschließlich die Ausnahme unten.
[extend]
useDefault = true

# Die Audit-Redaction-Tests brauchen einen Wert, der wie ein echtes Zugangsdatum
# AUSSIEHT: redactChanges stuft am FELDNAMEN ein, und die Tests belegen, dass ein
# Secret auch in ungewohnter Wertform nicht durchkommt. Der Wert ist frei erfunden
# und trägt seine Rolle im Namen.
#
# Die Ausnahme ist auf genau diese Zeichenkette gefesselt, nicht auf die Datei: eine
# Datei-Ausnahme würde auch ein echtes Zugangsdatum durchwinken, das jemand später
# versehentlich in dieselbe Testdatei schreibt. Jeder weitere Testwert braucht damit
# einen eigenen, sichtbaren Eintrag hier — genau die Reibung, die eine Ausnahme
# haben soll.
#
# OHNE regexTarget, also gegen das EXTRAHIERTE Secret statt gegen die ganze Zeile.
# Der Unterschied ist nicht theoretisch: mit regexTarget = "line" ist jeder Fund in
# einer Zeile entschuldigt, die den Wert irgendwo enthält — ein echter GitHub-Token
# im Kommentar hinter dem Testwert wurde so nachweislich übersehen. Gegen das Secret
# selbst gilt die Ausnahme nur für den Fund, der WIRKLICH dieser Wert ist.
#
# EINZAHL mit Absicht: gitleaks 8.24.3 (die Version in der Action) ignoriert die
# Mehrzahlform [[allowlists]] auf oberster Ebene stillschweigend — sie greift nur
# unter [[rules.allowlists]]. Ein Umbau auf die Mehrzahl sähe moderner aus und
# hätte keinerlei Wirkung. Ebenso wirkungslos ist dort condition = "AND": mehrere
# Bedingungen wirken als ODER (nachgemessen), deshalb steht hier genau eine.
[allowlist]
description = "Erfundener Secret-Wert in den Audit-Redaction-Tests (internal/handlers/audit_redact_test.go)"
regexes = ['''sk-live-4f9c2b7a-DIESER-WERT-DARF-NIE-AUFTAUCHEN''']
