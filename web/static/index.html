<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d9488">
    <meta name="description" content="Parkrr – Verwaltung von Einstellplätzen, Gefährten und Kosten.">
    <title>Parkrr</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="/icons/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <a class="skip-link" href="#page">Zum Inhalt springen</a>
    <!-- Login view -->
    <section id="login-view" class="login-view" hidden>
        <form id="login-form" class="login-card" autocomplete="on">
            <div class="brand">
                <img src="/icons/icon.svg" alt="" width="56" height="56">
                <h1>Parkrr</h1>
                <p class="muted">Einstellplatz-Verwaltung</p>
            </div>
            <label for="login-username">Benutzername</label>
            <input id="login-username" name="username" type="text" required autocomplete="username">
            <label for="login-password">Passwort</label>
            <input id="login-password" name="password" type="password" required autocomplete="current-password">
            <div id="login-totp-wrap" hidden>
                <label for="login-totp">Zwei-Faktor-Code</label>
                <input id="login-totp" name="totp" type="text" inputmode="numeric" autocomplete="one-time-code"
                       pattern="[0-9]*" maxlength="6" placeholder="123456">
            </div>
            <p id="login-error" class="form-error" role="alert" hidden></p>
            <button type="submit" class="btn btn-primary btn-block">Anmelden</button>
        </form>
    </section>

    <!-- App shell -->
    <div id="app-view" class="app-shell" hidden>
        <header class="app-header">
            <div class="app-header-inner">
                <div class="app-title">
                    <img src="/icons/icon.svg" alt="" width="28" height="28">
                    <span>Parkrr</span>
                </div>
                <div class="app-user">
                    <button id="theme-btn" class="btn-icon" type="button" aria-label="Design wechseln" title="Hell/Dunkel">◐</button>
                    <button id="menu-btn" class="btn-icon" type="button" aria-label="Menü">☰</button>
                </div>
            </div>
        </header>

        <main id="page" class="page" aria-live="polite"></main>

        <nav class="tabbar" aria-label="Hauptnavigation">
            <button class="tab" data-route="dashboard" type="button">
                <span class="tab-icon" aria-hidden="true">▤</span><span>Übersicht</span>
            </button>
            <button class="tab" data-route="persons" type="button">
                <span class="tab-icon" aria-hidden="true">☺</span><span>Personen</span>
            </button>
            <button class="tab" data-route="vehicles" type="button">
                <span class="tab-icon" aria-hidden="true">▣</span><span>Gefährte</span>
            </button>
            <button class="tab" data-route="finance" type="button">
                <span class="tab-icon" aria-hidden="true">€</span><span>Zusatzkosten</span>
            </button>
            <button class="tab" data-route="tariffs" type="button">
                <span class="tab-icon" aria-hidden="true">☰</span><span>Tarife</span>
            </button>
        </nav>
    </div>

    <!-- Slide-in menu (secondary navigation) -->
    <dialog id="menu" class="sheet">
        <div id="menu-body" class="sheet-body"></div>
    </dialog>

    <!-- Generic modal dialog (modern <dialog> element) -->
    <dialog id="modal" class="modal">
        <form method="dialog" id="modal-form">
            <header class="modal-header">
                <h2 id="modal-title">Titel</h2>
                <button type="button" class="btn-icon" id="modal-close" aria-label="Schließen">✕</button>
            </header>
            <div id="modal-body" class="modal-body"></div>
            <footer class="modal-footer">
                <button type="button" class="btn btn-ghost" id="modal-cancel">Abbrechen</button>
                <button type="submit" class="btn btn-primary" id="modal-submit">Speichern</button>
            </footer>
        </form>
    </dialog>

    <!-- Confirmation dialog -->
    <dialog id="confirm" class="modal modal-sm">
        <header class="modal-header">
            <h2 id="confirm-title">Bestätigen</h2>
        </header>
        <div id="confirm-body" class="modal-body"></div>
        <footer class="modal-footer">
            <button type="button" class="btn btn-ghost" id="confirm-cancel">Abbrechen</button>
            <button type="button" class="btn btn-danger" id="confirm-ok">Löschen</button>
        </footer>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="/js/app.js" defer></script>
</body>
</html>
