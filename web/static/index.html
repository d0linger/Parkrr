<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0F7A73">
    <meta name="description" content="Parkrr – Verwaltung von Einstellplätzen, Gefährten und Kosten.">
    <meta name="app-version" content="__APP_VERSION__">
    <title>Parkrr</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="/icons/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <a class="skip-link" href="#page">Zum Inhalt springen</a>
    <!-- Login view -->
    <section id="login-view" class="login-view" hidden>
        <div class="lv-bays" id="login-bays" aria-hidden="true"></div>
        <form id="login-form" class="login-card" autocomplete="on">
            <div class="brand">
                <span class="brand-veh brand-badge" data-veh="34" aria-hidden="true"></span>
                <h1>Parkrr</h1>
                <p class="muted">Einstellplatz-Verwaltung</p>
            </div>
            <label for="login-username">Benutzername</label>
            <input id="login-username" name="username" type="text" required autocomplete="username">
            <label for="login-password">Passwort</label>
            <div class="input-affix">
                <input id="login-password" name="password" type="password" required autocomplete="current-password">
                <button type="button" id="login-pw-toggle" class="affix-btn" aria-label="Passwort anzeigen" aria-pressed="false">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <div id="login-totp-wrap" hidden>
                <p id="login-step-ok" class="step-ok" role="status">✓ Passwort korrekt · jetzt der Zwei-Faktor-Code</p>
                <label id="login-totp-label" for="login-otp-0">Zwei-Faktor-Code</label>
                <!-- App-Code: six single-digit slots (auto-advance, paste-aware); built by JS. -->
                <div id="login-otp" class="otp-group" role="group" aria-labelledby="login-totp-label"></div>
                <!-- Backup-Code: one grouped field, shown when the user switches modes. -->
                <input id="login-backup" name="totp" type="text" inputmode="text" autocomplete="one-time-code"
                       maxlength="20" placeholder="ABCD-EFGH-IJKL" aria-describedby="login-totp-help" hidden>
                <button type="button" id="login-backup-toggle" class="linkbtn">Backup-Code verwenden</button>
                <p id="login-totp-help" class="field-hint">6-stelliger Code aus der App – oder ein Backup-Code, falls kein Handy zur Hand.</p>
            </div>
            <p id="login-error" class="form-error" role="alert" hidden></p>
            <button type="submit" class="btn btn-primary btn-block">Anmelden</button>
            <div class="or-divider" id="login-or" hidden>oder</div>
            <button type="button" id="passkey-login" class="btn btn-ghost btn-block" hidden><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="4.5"/><path d="M11.8 11.8 20 20M17 17l2.2-2.2M14.4 14.4l1.8-1.8"/></svg> Mit Passkey anmelden</button>
        </form>
    </section>

    <!-- Customer self-service portal (public, read-only; rendered for #/portal/<token>) -->
    <section id="portal-view" class="portal-view" hidden></section>

    <!-- App shell -->
    <div id="app-view" class="app-shell" hidden>
        <header class="app-header">
            <div class="app-header-inner">
                <a class="app-title" href="#/dashboard" aria-label="Parkrr – zur Startseite">
                    <span class="brand-veh" data-veh="28" aria-hidden="true"></span>
                    <span>Parkrr</span>
                </a>
                <div class="app-user">
                    <button id="search-btn" class="btn-icon" type="button" aria-label="Suche" title="Suche · ⌘K"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
                    <!-- Backup-Ampel: nur die Farbe, Details erst beim Hover/Tap. Steht bewusst
                         neben dem Design-Umschalter und nicht im Menü, damit der Zustand ohne
                         Klick sichtbar ist. Wird per JS befüllt und bleibt für Nur-Leser leer. -->
                    <div id="bkdot" class="bkdot" hidden>
                        <button id="bkdot-btn" class="btn-icon bkdot__btn" type="button"
                                aria-expanded="false" aria-controls="bkdot-pop" aria-label="Backup-Status">
                            <span class="bkdot__mark" aria-hidden="true"></span>
                        </button>
                        <div id="bkdot-pop" class="bkdot__pop" role="status"></div>
                    </div>
                    <button id="theme-btn" class="btn-icon" type="button" aria-label="Design wechseln" title="Hell/Dunkel"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg></button>
                    <button id="menu-btn" class="btn-icon" type="button" aria-label="Menü"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
                </div>
            </div>
        </header>

        <!-- Visually-hidden page-level heading; text is kept in sync per route so
             screen-reader heading navigation has an h1 root (pages start at h2). -->
        <h1 id="page-title" class="sr-only">Parkrr</h1>
        <main id="page" class="page" aria-live="polite"></main>

        <nav class="tabbar" aria-label="Hauptnavigation">
            <button class="tab" data-route="dashboard" type="button">
                <span class="tab-pill" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg></span><span>Übersicht</span>
            </button>
            <button class="tab" data-route="persons" type="button">
                <span class="tab-pill" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M3.5 20c.6-3.4 2.9-5.2 5.5-5.2s4.9 1.8 5.5 5.2"/><path d="M16 5.4a3.4 3.4 0 0 1 0 5.9M17.8 14.9c1.6.8 2.6 2.4 3 5.1"/></svg></span><span>Personen</span>
            </button>
            <button class="tab" data-route="vehicles" type="button">
                <span class="tab-pill" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-3.2c0-.6.2-1.2.6-1.7l2-2.6c.4-.5 1-.8 1.6-.8h6.4c.7 0 1.3.3 1.7.9l1.9 2.5c.4.5.6 1.1.6 1.7V16"/><circle cx="7.5" cy="17" r="1.8"/><circle cx="16.5" cy="17" r="1.8"/><path d="M3 16h18"/></svg></span><span>Gefährte</span>
            </button>
            <button class="tab" data-route="finance" type="button">
                <span class="tab-pill" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 6.5A7 7 0 1 0 17.5 17.5"/><path d="M5 10.2h9M5 13.8h9"/></svg></span><span>Zusatzkosten</span>
            </button>
            <button class="tab" data-route="tariffs" type="button">
                <span class="tab-pill" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12.6 3.6 20.4 11.4a2 2 0 0 1 0 2.8l-6.2 6.2a2 2 0 0 1-2.8 0L3.6 12.6V5.6a2 2 0 0 1 2-2h7Z"/><circle cx="8.3" cy="8.3" r="1.3"/></svg></span><span>Tarife</span>
            </button>
        </nav>
    </div>

    <!-- Slide-in menu (secondary navigation) -->
    <dialog id="menu" class="sheet">
        <div id="menu-body" class="sheet-body"></div>
    </dialog>

    <!-- Generic modal dialog (modern <dialog> element) -->
    <dialog id="modal" class="modal" aria-labelledby="modal-title">
        <form method="dialog" id="modal-form">
            <header class="modal-header">
                <h2 id="modal-title">Titel</h2>
                <button type="button" class="btn-icon" id="modal-close" aria-label="Schließen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
            </header>
            <div id="modal-body" class="modal-body"></div>
            <footer class="modal-footer">
                <button type="button" class="btn btn-ghost" id="modal-cancel">Abbrechen</button>
                <button type="submit" class="btn btn-primary" id="modal-submit">Speichern</button>
            </footer>
        </form>
    </dialog>

    <!-- Confirmation dialog (destructive actions: danger header with a warning icon). -->
    <dialog id="confirm" class="modal modal-sm modal-danger" aria-labelledby="confirm-title">
        <div class="confirm-head">
            <span class="confirm-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 22 20H2L12 3.5Z"/><path d="M12 10v4M12 17.3v.2"/></svg></span>
            <h2 id="confirm-title">Bestätigen</h2>
        </div>
        <div id="confirm-body" class="modal-body"></div>
        <footer class="modal-footer">
            <button type="button" class="btn btn-ghost" id="confirm-cancel">Abbrechen</button>
            <button type="button" class="btn btn-danger" id="confirm-ok">Löschen</button>
        </footer>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="/js/geometry.js" defer></script>
    <script src="/js/app.js" defer></script>
</body>
</html>
