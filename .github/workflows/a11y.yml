name: a11y

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  a11y:
    name: Accessibility (Playwright + axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parkrr
          POSTGRES_PASSWORD: parkrr
          POSTGRES_DB: parkrr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkrr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Build parkrr
        run: go build -o parkrr ./cmd/parkrr

      - name: Start parkrr
        env:
          PARKRR_DATABASE_URL: postgres://parkrr:parkrr@localhost:5432/parkrr?sslmode=disable
          PARKRR_LISTEN_ADDR: ":8080"
          PARKRR_SESSION_SECRET: ci-a11y-session-secret-not-a-real-secret
          PARKRR_ADMIN_USERNAME: admin
          PARKRR_ADMIN_PASSWORD: ci-a11y-admin-password
          PARKRR_SECURE_COOKIES: "false"
          PARKRR_CHECK_BREACHED_PASSWORDS: "false"
          PARKRR_WEBAUTHN_RP_ID: localhost
          PARKRR_WEBAUTHN_ORIGINS: http://localhost:8080
          # Der ganze a11y-Lauf kommt aus EINER IP; der Standard von 600/min reicht
          # fuer 41 Tests mit Seed-/Cleanup-Verkehr nicht und die Middleware
          # antwortete mit 429 {"error":"rate limit exceeded"} — das trieb render-race,
          # truncation und die Planer-Tests in wandernde Fehlschlaege. Fuer den Testlauf
          # praktisch abschalten.
          PARKRR_RATE_LIMIT_PER_MIN: "100000"
          # Ohne Schluessel zeigt die Backup-Seite nur "Nicht aktiviert" und rendert
          # KEINE .sched-col — der B8-Zeitplan-Test konnte in CI also nie bestehen
          # (in allen Laeufen 3/3 rot, deterministisch). Kein echtes Geheimnis;
          # config.go verlangt mindestens 32 Bytes.
          PARKRR_BACKUP_KEY: ci-a11y-backup-key-not-a-real-secret-0000
          PARKRR_BACKUP_DIR: /tmp/parkrr-a11y-backups
        run: |
          mkdir -p /tmp/parkrr-a11y-backups
          ./parkrr &
          echo "PARKRR_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ >/dev/null; then echo "parkrr up"; exit 0; fi
            sleep 1
          done
          echo "::error::parkrr did not become ready" && exit 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Accessibility tests
        working-directory: tests/a11y
        env:
          PARKRR_BASE_URL: http://localhost:8080
          PARKRR_E2E_ISOLATED: "1"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Stop parkrr
        if: always()
        run: kill "${PARKRR_PID}" 2>/dev/null || true
