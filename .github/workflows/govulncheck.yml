name: govulncheck

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly scan to catch newly disclosed vulnerabilities.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
