name: gosec

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  gosec:
    name: Security scan (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-dir=.github ./...
