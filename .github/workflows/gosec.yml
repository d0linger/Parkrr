name: gosec

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  gosec:
    name: Security scan (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pin the scanner and its Go export-data reader in a separate tool module.
      # gosec's original x/tools cannot read Go 1.27.2+ export data (v5).
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: |
            go.sum
            .github/tools/gosec/go.sum

      - name: Build pinned gosec
        run: |
          go -C .github/tools/gosec build -mod=readonly -o "${RUNNER_TEMP}/gosec" github.com/securego/gosec/v2/cmd/gosec
          go version -m "${RUNNER_TEMP}/gosec"

      - name: Run gosec
        # G706 (log injection) is excluded project-wide: all logging goes through
        # log/slog, whose handlers escape (JSON) or quote (text) string attribute
        # values, so user-controlled fields cannot forge log records. Other
        # reviewed exceptions (G124 cookies, G120 bounded multipart) are handled
        # with inline #nosec annotations.
        run: |
          "${RUNNER_TEMP}/gosec" -concurrency=2 -exclude-dir=.github -exclude=G706 ./...
