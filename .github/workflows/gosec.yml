name: gosec

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  gosec:
    name: Security scan (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # gosec 2.27.x needs a newer Go to build than the app targets; pin both
      # the Go version and the gosec version so the scan is deterministic and
      # a new gosec release cannot break CI with newly added default rules.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          cache: true

      - name: Run gosec
        # G706 (log injection) is excluded project-wide: all logging goes through
        # log/slog, whose handlers escape (JSON) or quote (text) string attribute
        # values, so user-controlled fields cannot forge log records. Other
        # reviewed exceptions (G124 cookies, G120 bounded multipart) are handled
        # with inline #nosec annotations.
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          gosec -exclude-dir=.github -exclude=G706 ./...
