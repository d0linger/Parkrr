name: Trivy

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "27 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Trivy (SCA + misconfig, report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Versioned action from the Trivy publisher (no `curl | sh` from a mutable branch).
      # Dependabot (github-actions ecosystem) keeps this pinned/updated to match the
      # repo's action-pinning discipline. Report-only (exit-code 0): govulncheck already
      # GATES Go vulnerabilities with reachability analysis, so trivy's match-based vuln
      # hits (which flag even unreachable CVEs) must not block CI. Trivy's added value
      # here is Dockerfile/Compose misconfig + secret detection, surfaced for review.
      # To make it a gate later, set exit-code '1' (ideally scoped to misconfig,secret).
      - name: Trivy filesystem scan (report-only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table
