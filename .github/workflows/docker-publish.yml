name: Docker (GHCR multi-arch image)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege at the workflow level: contents:read only. packages:write is
# granted ONLY to the push-only publish job below, so a compromised action can
# never obtain registry-write during a pull_request run (finding SH-01).
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Read-only validation on pull requests: build the multi-arch image WITHOUT
  # pushing and without any write token, so the Dockerfile/build is exercised
  # before anything can be published.
  validate:
    name: Build (validate, no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Minify static JavaScript
        run: |
          npx --yes esbuild@0.24.2 web/static/js/app.js --minify --allow-overwrite --outfile=web/static/js/app.js
          npx --yes esbuild@0.24.2 web/static/sw.js     --minify --allow-overwrite --outfile=web/static/sw.js
          node --check web/static/js/app.js
          node --check web/static/sw.js

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          build-args: |
            VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publish on branch/tag pushes and manual dispatch only. This is the ONLY job
  # that holds packages:write, and it never runs for a pull_request.
  publish:
    name: Build & Push (linux/amd64, linux/arm64)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Minify the embedded static JS before the image build so the shipped image
      # (go:embed web/static) carries the compact assets. Runs in the ephemeral
      # workspace only — the committed sources stay readable.
      - name: Minify static JavaScript
        run: |
          npx --yes esbuild@0.24.2 web/static/js/app.js --minify --allow-overwrite --outfile=web/static/js/app.js
          npx --yes esbuild@0.24.2 web/static/sw.js     --minify --allow-overwrite --outfile=web/static/sw.js
          node --check web/static/js/app.js
          node --check web/static/sw.js

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          build-args: |
            VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
