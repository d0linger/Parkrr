name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parkrr
          POSTGRES_PASSWORD: parkrr
          POSTGRES_DB: parkrr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkrr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Enables the database-gated integration tests (migrations, handlers).
      # pool_max_conns caps each package's pool so parallel `go test ./...` doesn't
      # collectively exhaust the DB's connections (honored by database.Connect).
      PARKRR_TEST_DATABASE_URL: postgres://parkrr:parkrr@localhost:5432/parkrr_test?sslmode=disable&pool_max_conns=4
      # Coverage ratchet floor. Raise this as coverage grows; the gate fails the
      # build if total statement coverage drops below it. Der Boden liegt bewusst
      # UNTER dem Istwert, damit normale Arbeit nicht sofort anschlaegt (Hundert 94).
      #
      # WICHTIG: gemessen wird unter Linux (wie hier). Die frueher notierten 69,5 %
      # stammten aus einer WINDOWS-Messung, die server.go faelschlich mit 6384 statt
      # 342 Statements zaehlt (ein Zaehl-Artefakt der Cover-Werkzeuge bei CRLF) und
      # den Wert dadurch stark aufblaeht. Der ehrliche Istwert dieses Zweigs liegt
      # bei rund 59,8 % (Linux, mit -race); die grosse Feature-Arbeit (Backup ueber
      # pg_dump/S3, tiefe Transaktionspfade) ist absichtlich nicht als Unit-Test
      # gedeckt. Neue Integrationstests (coverage_endpoints_test.go) haben den Wert
      # von 56,8 % dorthin gehoben.
      COVERAGE_MIN: "57"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Download & verify modules
        run: |
          go mod download
          go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Verify large backup restore under hardened limits
        run: bash scripts/test-backup-restore.sh

      # Diagnose zur Abdeckungsluecke: der CI-Wert (56,8 %) liegt weit unter dem lokal
      # gemessenen (72,9 %, vor UND nach den letzten Commits identisch). Da der
      # Test-Schritt hier BESTEHT, muss ein Teil der Tests still uebersprungen werden.
      # Diese Tabelle rechnet die Abdeckung je Paket direkt aus coverage.out (kein
      # zweiter Testlauf) — ein Paket weit unter seinem lokalen Wert ist das, dessen
      # Datenbanktests in CI nicht laufen. Laeuft auch bei rotem Gate (if: always()).
      - name: Coverage per package (diagnostic)
        if: always()
        run: |
          echo "Abdeckung je Paket (aufsteigend):"
          awk 'NR>1 { colon=index($0,":"); file=substr($0,1,colon-1);
                      n=split(file,parts,"/"); pkg=""; for(i=1;i<n;i++) pkg=pkg parts[i] "/";
                      split(substr($0,colon+1),a," "); stmts=a[2]; cnt=a[3];
                      tot[pkg]+=stmts; if (cnt>0) cov[pkg]+=stmts }
               END { for (k in tot) printf "%6.1f%%  %s\n", 100*cov[k]/tot[k], k }' coverage.out | sort -n

      - name: Coverage gate
        run: |
          # Bei rotem Boden SOFORT zeigen, welches Paket eingebrochen ist — dieselbe
          # Tabelle wie der Diagnoseschritt, aber HIER, direkt ueber dem Fehler, damit
          # sie im geposteten Log nicht uebersehen wird. internal/server schwankt je
          # nach DB-Verfuegbarkeit zwischen 97 % und 3 %; ein Paket weit unter seinem
          # lokalen Wert ist das, dessen DB-Tests hier nicht laufen.
          go tool cover -func=coverage.out | awk 'NR>1 { c=index($0,":"); f=substr($0,1,c-1); n=split(f,a,"/"); pkg=""; for(i=1;i<n;i++) pkg=pkg a[i] "/"; split(substr($0,c+1),x," "); tot[pkg]+=x[2]; if(x[3]>0) cov[pkg]+=x[2] } END { print "Abdeckung je Paket:"; for (k in tot) if (tot[k]>0) printf "  %6.1f%%  %s\n", 100*cov[k]/tot[k], k }' | sort -t% -k1 -n
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "Total statement coverage: ${total}% (minimum ${COVERAGE_MIN}%)"
          awk -v t="$total" -v m="$COVERAGE_MIN" 'BEGIN { exit (t+0 < m+0) ? 1 : 0 }' \
            || { echo "::error::coverage ${total}% is below the ${COVERAGE_MIN}% floor"; exit 1; }

      - name: Build
        run: go build ./...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Minify embedded static JS before the image build (same as docker-publish),
      # so the validation build exercises the shipped, minified assets.
      - name: Minify static JavaScript
        run: |
          npx --yes esbuild@0.24.2 web/static/js/app.js --minify --allow-overwrite --outfile=web/static/js/app.js
          npx --yes esbuild@0.24.2 web/static/sw.js     --minify --allow-overwrite --outfile=web/static/sw.js
          node --check web/static/js/app.js
          node --check web/static/sw.js
      - name: Build image
        run: docker build -t parkrr:ci .
      # Trivy als GEPRÜFTES Binary statt als Action (Hundert 45): die trivy-action
      # fiel unserer SHA-Pin-Policy und einem Supply-Chain-Advisory zum Opfer und
      # wurde entfernt — seither lief gar kein Image-Scan mehr. Ein per SHA-256
      # verifizierter Release-Download hat dieselbe Wirkung ohne fremden
      # Action-Code: Version UND Prüfsumme sind hier festgeschrieben, ein
      # ausgetauschtes Release-Asset fällt am Hash auf.
      - name: Scan image (Trivy, pinned + checksummed binary)
        run: |
          TRIVY_VERSION=0.74.0
          TRIVY_SHA256=2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          curl -sSfL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy
          # Gate auf HIGH/CRITICAL mit Fix; unfixierte Findings werden gemeldet,
          # brechen aber nicht — dagegen kann ein Rebuild nichts tun.
          ./trivy image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL parkrr:ci

  actions-pinned:
    name: Actions pinned to SHA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Supply-chain guard: every external `uses:` must reference an immutable
      # 40-char commit SHA (a movable tag can be retagged to hostile code). Local
      # actions (uses: ./...) are exempt. Keeps the SHA pinning from regressing.
      - name: Verify every external action is pinned to a full commit SHA
        run: |
          unpinned=$(grep -rnE 'uses:[[:space:]]+[^[:space:]]+' .github/workflows/ \
            | grep -vE 'uses:[[:space:]]+\./' \
            | grep -vE '@[0-9a-fA-F]{40}([[:space:]]|#|$)' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::GitHub Actions must be pinned to a full 40-char commit SHA:"
            echo "$unpinned"
            exit 1
          fi
          echo "All external actions are SHA-pinned."

  geometry:
    name: Planner geometry tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pure geometry unit tests for web/static/js/geometry.js via Node's built-in test
      # runner (preinstalled on the runner — no extra action). Guards the planner's
      # area / wall-offset / collinear-inheritance maths on every PR.
      - name: Run geometry unit tests
        run: node --test tests/geometry/geometry.test.js
