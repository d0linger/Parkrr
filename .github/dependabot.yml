version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/.github/tools/gosec"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "gomod"
    # Batch routine minor/patch bumps into one PR; majors stay individual.
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions (workflows). SHA-pinned `uses:` refs are updated in place,
  # keeping the `# vX` comment in sync.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vienna"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker base images: the release Dockerfile and the isolated validation toolchain
  # (scripts/validation) pin the same golang image and must move together.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/scripts/validation"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vienna"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
    # Go release-line upgrades must update go.mod and all CI compilers together.
    # Keep patch/digest updates visible; check-go-version.cjs enforces alignment.
    ignore:
      - dependency-name: "golang"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # npm — accessibility test tooling (Playwright + axe-core), lockfile committed.
  - package-ecosystem: "npm"
    directory: "/tests/a11y"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vienna"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "npm"
    groups:
      a11y-tooling:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Digest-pinned database images in the Compose deployments.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vienna"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
